<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BEAN CHARGE 3D</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #f6eadc, #1a120d);
}

canvas {
  display: block;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 40px;
  color: white;
  pointer-events: none;
}

.title {
  font-size: 60px;
  font-weight: bold;
  letter-spacing: 2px;
}

.subtitle {
  opacity: 0.7;
  margin-top: 10px;
}

.tag {
  margin-top: 20px;
  display: inline-block;
  padding: 10px 18px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 999px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="overlay">
  <div class="title">BEAN CHARGE</div>
  <div class="subtitle">Interactive 3D Mobile Coffee Experience · Soweto</div>
  <div class="tag">Move your mouse ✦ drag to explore</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let cup, beans = [];

init();
animate();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  camera.position.z = 8;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  // LIGHTS
  const light = new THREE.PointLight(0xffffff, 1.2);
  light.position.set(5, 5, 5);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0xffd7b0, 0.4);
  scene.add(ambient);

  // CUP (main model)
  const cupGeo = new THREE.CylinderGeometry(1.2, 1, 2.5, 32);
  const cupMat = new THREE.MeshStandardMaterial({
    color: 0xf5efe6,
    roughness: 0.4,
    metalness: 0.1
  });

  cup = new THREE.Mesh(cupGeo, cupMat);
  scene.add(cup);

  // TOP COFFEE SURFACE
  const coffeeGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.1, 32);
  const coffeeMat = new THREE.MeshStandardMaterial({
    color: 0x3b2416,
    roughness: 0.2
  });

  const coffee = new THREE.Mesh(coffeeGeo, coffeeMat);
  coffee.position.y = 1.25;
  scene.add(coffee);

  // HANDLE
  const handleGeo = new THREE.TorusGeometry(0.6, 0.15, 16, 50);
  const handleMat = new THREE.MeshStandardMaterial({
    color: 0xe7dccf
  });

  const handle = new THREE.Mesh(handleGeo, handleMat);
  handle.position.x = 1.2;
  handle.rotation.z = Math.PI / 2;
  scene.add(handle);

  // PORTAFILTER (simple)
  const portGeo = new THREE.BoxGeometry(2, 0.3, 0.6);
  const portMat = new THREE.MeshStandardMaterial({ color: 0x2a1b12 });

  const portafilter = new THREE.Mesh(portGeo, portMat);
  portafilter.position.set(-3, -1.5, 0);
  portafilter.rotation.z = -0.4;
  scene.add(portafilter);

  // COFFEE BEANS (particles)
  const beanGeo = new THREE.SphereGeometry(0.08, 12, 12);
  const beanMat = new THREE.MeshStandardMaterial({ color: 0x4b2f1d });

  for (let i = 0; i < 80; i++) {

    const bean = new THREE.Mesh(beanGeo, beanMat);

    bean.position.x = (Math.random() - 0.5) * 10;
    bean.position.y = (Math.random() - 0.5) * 6;
    bean.position.z = (Math.random() - 0.5) * 6;

    scene.add(bean);
    beans.push(bean);
  }

  // RESIZE
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // MOUSE MOVE INTERACTION
  document.addEventListener("mousemove", (e) => {

    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;

    cup.rotation.y = x * 0.8;
    cup.rotation.x = y * 0.4;

    handle.rotation.y = x * 0.5;
  });
}

function animate() {

  requestAnimationFrame(animate);

  cup.rotation.y += 0.002;

  beans.forEach((b, i) => {
    b.position.y += Math.sin(Date.now() * 0.001 + i) * 0.002;
  });

  renderer.render(scene, camera);
}
</script>

</body>
</html>
