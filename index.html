<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAN CHARGE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,sans-serif;
  background:#f7f1e8;
  color:#2b1d14;
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:100vh;
  position:relative;
  background: radial-gradient(circle at top,#3a2418,#120b08);
}
canvas{
  width:100%;
  height:100%;
  display:block;
}
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#fff;
  pointer-events:none;
}
.overlay h1{
  font-size:clamp(2.5rem,6vw,5rem);
  letter-spacing:-1px;
}
.overlay p{
  opacity:.8;
  margin-top:10px;
}

/* NAV */
.nav{
  position:sticky;
  top:0;
  background:#f7f1e8cc;
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  font-weight:600;
}

/* SECTIONS */
section{
  padding:70px 20px;
  max-width:1000px;
  margin:auto;
}

h2{
  margin-bottom:20px;
  font-size:28px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
}

/* FORM */
input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  background:#c08a2b;
  color:white;
  border:none;
  padding:12px;
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px;
  background:#120b08;
  color:white;
}
</style>
</head>

<body>

<div class="hero">
  <div id="scene"></div>

  <div class="overlay">
    <h1>BEAN CHARGE</h1>
    <p>Mobile coffee experience</p>
  </div>
</div>

<div class="nav">
  <div>BEAN CHARGE</div>
  <div>Menu · Book · Contact</div>
</div>

<section>
  <h2>Menu</h2>
  <div class="menu">
    <div class="card">Espresso<br>R15</div>
    <div class="card">Americano<br>R15</div>
    <div class="card">Latte<br>R15</div>
    <div class="card">Cappuccino<br>R15</div>
  </div>
</section>

<section>
  <h2>Book</h2>
  <input id="name" placeholder="Name">
  <input id="email" placeholder="Email">
  <input id="date" type="date">
  <textarea id="msg" placeholder="Event details"></textarea>
  <button onclick="send()">Send via WhatsApp</button>
</section>

<footer>
© BEAN CHARGE
</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

/* LIGHTS */
const light = new THREE.PointLight(0xffcc88,1.5);
light.position.set(2,3,3);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.3));

/* CUP */
const cup = new THREE.Mesh(
  new THREE.CylinderGeometry(1,0.8,2,40),
  new THREE.MeshStandardMaterial({color:0xf2e6d8})
);
scene.add(cup);

/* COFFEE */
const coffee = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9,0.9,0.2,40),
  new THREE.MeshStandardMaterial({color:0x3b2416})
);
coffee.position.y=0.9;
scene.add(coffee);

/* PORTAFILTER */
const pf = new THREE.Mesh(
  new THREE.BoxGeometry(1.5,0.2,0.6),
  new THREE.MeshStandardMaterial({color:0x2b1b12})
);
pf.position.set(-2,-1,0);
scene.add(pf);

/* BEANS */
const beans=[];
for(let i=0;i<120;i++){
  const b=new THREE.Mesh(
    new THREE.SphereGeometry(0.06,8,8),
    new THREE.MeshStandardMaterial({color:0x4a2f1d})
  );
  b.position.set(
    (Math.random()-0.5)*8,
    (Math.random()-0.5)*5,
    (Math.random()-0.5)*4
  );
  scene.add(b);
  beans.push(b);
}

function animate(){
  requestAnimationFrame(animate);

  cup.rotation.y += 0.003;
  coffee.rotation.y += 0.003;
  pf.rotation.y += 0.002;

  beans.forEach(b=>{
    b.position.y += 0.003;
    if(b.position.y>3)b.position.y=-3;
  });

  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* WhatsApp */
function send(){
  const name=document.getElementById("name").value;
  const email=document.getElementById("email").value;
  const date=document.getElementById("date").value;
  const msg=document.getElementById("msg").value;

  const text=`Booking:%0A${name}%0A${email}%0A${date}%0A${msg}`;

  window.open(`https://wa.me/27693412372?text=${text}`);
}
</script>

</body>
</html>
